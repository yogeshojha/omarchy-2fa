name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.15.0

      - name: ruff check
        run: ruff check --output-format=github .

      # Runs even when the lint step above fails, so a PR gets both reports at once.
      - name: ruff format
        if: always()
        run: ruff format --check --diff .

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install gpg
        run: sudo apt-get update && sudo apt-get install -y gnupg

      - name: Behaviour
        run: python3 test/test_twofa.py

      - name: Security properties
        if: always()
        run: python3 test/test_security.py
